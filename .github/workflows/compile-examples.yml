on: [push]
name: "build examples"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get install -y liblzma-dev

      - uses: actions/checkout@v4
      - uses: freckle/stack-action@v5
        with:
          working-directory: ./examples/mig-example-apps
