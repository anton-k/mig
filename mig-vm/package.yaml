name:                mig-vm
version:             0.2.1.0
github:              "anton-k/mig"
license:             BSD3
author:              "Anton Kholomiov"
maintainer:          "anton.kholomiov@gmail.com"
copyright:           "2023 Anton Kholomiov"

# Metadata used when publishing your package
synopsis:            Server VM
category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: |
  Virtual machine for server handlers

default-extensions:
  - OverloadedStrings
  - TypeFamilies
  - OverloadedRecordDot
  - DuplicateRecordFields
  - LambdaCase
  - DerivingStrategies
  - StrictData
  - AllowAmbiguousTypes
  - DataKinds
  - RecordWildCards

language: GHC2021

ghc-options:
# - -Werror
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Wunused-packages

library:
  source-dirs: src
  dependencies:
  - base >= 4.7 && < 5
  - bytestring
  - text
  - unliftio-core
  - http-api-data
  - HList
  - queues
  - mtl


tests:
  mig-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - mig-vm
    - base >= 4.7 && < 5
    - containers
    - mtl
    - bytestring
    - vector

